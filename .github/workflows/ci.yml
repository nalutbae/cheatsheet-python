name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  compile-check:
    name: Compile Check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check all Python files
        run: |
          echo "Checking all .py files compile without errors..."
          FAILED=0
          for f in $(find . -name '*.py' -not -path '*__pycache__*' -not -path '*examples*' | sort); do
            if python -m py_compile "$f" 2>/dev/null; then
              echo "  OK: $f"
            else
              echo "  FAIL: $f"
              FAILED=1
            fi
          done
          if [ $FAILED -ne 0 ]; then
            echo "::error::Some files failed to compile"
            exit 1
          fi
          echo "All files compiled successfully!"

      - name: Verify naming convention
        run: |
          echo "Checking file naming convention (category_sequence_description.py)..."
          FAILED=0
          for f in $(find . -name '*.py' -not -path '*__pycache__*' -not -path '*examples*' -not -path '*shapes*' | sort); do
            basename=$(basename "$f")
            # Check for dots in filename (other than .py extension)
            name_without_ext="${basename%.py}"
            if echo "$name_without_ext" | grep -q '\.'; then
              echo "  BAD: $f (contains dot in filename)"
              FAILED=1
            else
              echo "  OK: $f"
            fi
          done
          if [ $FAILED -ne 0 ]; then
            echo "::error::Some files have invalid naming"
            exit 1
          fi
          echo "All filenames follow convention!"

      - name: Check no __pycache__ committed
        run: |
          if find . -name '__pycache__' -print -quit | grep -q .; then
            echo "::error::__pycache__ directories found in repository"
            find . -name '__pycache__' -type d
            exit 1
          fi
          echo "No __pycache__ directories found."

  run-stdlib:
    name: Run Stdlib Examples (Python 3.12)
    runs-on: ubuntu-latest
    needs: compile-check

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run stdlib examples
        run: |
          for f in stdlib/stdlib_*.py; do
            echo "Running $f..."
            timeout 30 python "$f" > /dev/null 2>&1 && echo "  OK: $f" || echo "  WARN: $f (exit code: $?)"
          done